server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # API backendu
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck backendu dostępny przez nginx
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Placeholder pod przyszły frontend (etap 7-8)
    location / {
        default_type text/html;
        return 200 '<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Encoder</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:48rem;margin:4rem auto;padding:0 1rem;line-height:1.5;color:#111}code{background:#f3f4f6;padding:.1rem .3rem;border-radius:.25rem}</style></head><body><h1>Task Encoder</h1><p>Frontend będzie dodany w kolejnych etapach. Backend i API są dostępne pod <code>/api</code>.</p></body></html>';
    }
}
