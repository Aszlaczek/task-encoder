server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 1m;

    # API backendu — jedna origin, więc nie ma potrzeby konfigurować CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Publiczny healthcheck backendu.
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Brakujące pliki z hashem nie mogą zwracać index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router obsługuje trasy po stronie klienta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
