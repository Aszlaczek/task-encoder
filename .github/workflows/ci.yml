name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testy JUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testy backendu
        working-directory: backend
        run: ./mvnw -q test

      - name: Raport Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, RTL i build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        working-directory: frontend
        run: npm ci

      - name: Formatowanie
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testy RTL
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Statyka zbudowanej aplikacji
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  e2e:
    name: E2E — Playwright i zrzuty ekranu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        working-directory: frontend
        run: npm ci

      - name: Instalacja Chromium z zależnościami systemowymi
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Przygotowanie lokalnego .env
        run: |
          printf 'APP_CRYPTO_KEY=%s\n' "$(openssl rand -base64 32)" > .env
          chmod 600 .env
          docker compose config --quiet

      - name: Testy E2E
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Zrzuty ekranu
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:screenshots

      - name: Raporty Playwright i artefakty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Sprzątanie Docker Compose
        if: always()
        run: docker compose down -v --remove-orphans || true
